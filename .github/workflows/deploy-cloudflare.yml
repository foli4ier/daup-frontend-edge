name: Deploy app.daup.co.za

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daup-frontend-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: daup-frontend-edge/.node-version
          cache: npm
          cache-dependency-path: daup-frontend-edge/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: daup-frontend-edge
          command: deploy
          # Use the repo wrangler (v4, assets-only). Do not fall back to wrangler 3.
          packageManager: npm
